<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Harvest & Hearth</title>
  <meta name="description" content="Sign in to your Harvest & Hearth guest and supper club account.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23BA5D38'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/></svg>">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="auth-page-body">

  <!-- Top Navigation Bar with Theme & RTL Toggles (All Devices) -->
  <header class="auth-topbar" aria-label="Authentication Navigation">
    <a href="index.html" class="auth-back-link" title="Return to Homepage">
      <i class="ri-arrow-left-line"></i>
      <span>Back to Hearth</span>
    </a>

    <div class="auth-topbar-actions">
      <!-- RTL Toggle Button (Double Arrow ⇄, No text label) -->
      <button type="button" class="btn-icon rtl-toggle-btn" aria-label="Toggle RTL layout" title="Switch text direction">
        <i class="ri-arrow-left-right-line"></i>
      </button>

      <!-- Theme Toggle Button (Sun/Moon) -->
      <button type="button" class="btn-icon theme-toggle-btn" aria-label="Toggle Dark / Light Theme" title="Toggle theme mode">
        <i class="ri-moon-line"></i>
      </button>
    </div>
  </header>

  <main class="auth-card">
    <a href="index.html" class="brand-logo auth-logo" title="Return to Homepage">
      <i class="ri-fire-line brand-logo-icon"></i>
      <span>Harvest & Hearth</span>
    </a>

    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p style="font-size: var(--size-caption); color: var(--color-text-muted);">
        Sign in to your guest portal or kitchen administration
      </p>
    </div>

    <!-- Client-Side Validated Login Form (Step 12) -->
    <form data-validate="true" class="auth-form" id="login-form">
      <div class="form-success-banner">
        <i class="ri-checkbox-circle-fill"></i>
        <span>Login successful. Redirecting to dashboard...</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-email">
          Email Address <span class="required-star">*</span>
        </label>
        <input type="email" id="login-email" name="email" class="form-input" placeholder="name@domain.com" required>
        <span class="form-error-msg">Please enter a valid email address.</span>
      </div>

      <div class="form-group" style="margin-bottom: var(--space-3);">
        <label class="form-label" for="login-password">
          Password <span class="required-star">*</span>
        </label>
        <div class="password-input-wrap">
          <input type="password" id="login-password" name="password" class="form-input" placeholder="••••••••" required>
          <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password">
            <i class="ri-eye-line"></i>
          </button>
        </div>
        <span class="form-error-msg">Password must be at least 8 characters.</span>
      </div>

      <!-- Remember Me Checkbox & Forgot Text Placed Below Text Box -->
      <div class="auth-extra-row">
        <label class="form-checkbox-label" for="login-remember" style="margin: 0; align-items: center; cursor: pointer;">
          <input type="checkbox" id="login-remember" name="remember" style="cursor: pointer;">
          <span style="font-size: var(--size-caption);">Remember me</span>
        </label>
        <a href="#" class="auth-forgot-link">Forgot?</a>
      </div>

      <!-- Primary Login Button (Labeled exactly "Login") -->
      <button type="submit" class="btn btn-primary auth-btn-submit" id="login-submit-btn">Login</button>

      <div class="auth-divider">
        <span>or continue with</span>
      </div>

      <!-- OAuth Buttons -->
      <div class="oauth-btn-group">
        <!-- Google Official Icon -->
        <button type="button" class="btn-oauth" id="google-login-btn">
          <svg class="oauth-svg" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <!-- Apple Official Icon -->
        <button type="button" class="btn-oauth" id="apple-login-btn">
          <svg class="oauth-svg" viewBox="0 0 170 170" width="20" height="20" fill="currentColor">
            <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.69-7.85-12-14.42-6.09-9.34-10.87-19.86-14.34-31.54-3.47-11.68-5.21-22.9-5.21-33.68 0-14.12 3.6-26.04 10.8-35.76 7.2-9.72 16.32-14.67 27.36-14.85 4.68 0 9.87 1.23 15.57 3.69 5.7 2.45 9.4 3.74 11.1 3.86 1.7 0 5.66-1.41 11.88-4.23 6.22-2.82 11.69-4.12 16.41-3.9 12.28.65 22.37 5.37 30.27 14.17-10.74 6.53-16 15.42-15.78 26.68.22 8.91 3.59 16.41 10.11 22.5 6.52 6.09 14.24 9.57 23.15 10.43-2.17 6.74-4.89 13.59-8.15 20.55zM119.22 31.84c0-7.39 2.61-14.35 7.83-20.87 5.22-6.52 11.74-10.54 19.57-12.07.22 1.3.33 2.39.33 3.26 0 7.39-2.72 14.57-8.15 21.52-5.43 6.96-12 11.1-19.71 12.43-.22-1.3-.33-2.4-.33-3.27z"/>
          </svg>
          <span>Continue with Apple</span>
        </button>
      </div>

      <div class="auth-switch-link">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </form>
  </main>

  <!-- Back to Top Button (All Devices) -->
  <button type="button" class="back-to-top-btn" id="back-to-top" aria-label="Back to top" title="Back to top">
    <i class="ri-arrow-up-line"></i>
  </button>

  <script src="assets/js/main.js"></script>
  <script>
    // Demo redirect on successful submit
    document.getElementById('login-form').addEventListener('submit', (e) => {
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1200);
    });
  </script>
</body>
</html>
